oneOf:
  - type: object # Existing account, 2FA disabled or non-existent account
    properties:
      success:
        type: boolean
        enum: [true]
      acc_exists:
        type: boolean
      2fa_enabled:
        type: boolean
        enum: [false]
      user:
        $ref: "../components/User.yaml"
    required: [success, acc_exists, 2fa_enabled, user]
  - type: object # Existing account, 2FA enabled
    properties:
      success:
        type: boolean
        enum: [true]
      acc_exists:
        type: boolean
        enum: [true]
      2fa_enabled:
        type: boolean
        enum: [true]
      access_token:
        $ref: "../components/AccessToken.yaml"
    required: [success, acc_exists, 2fa_enabled, access_token]