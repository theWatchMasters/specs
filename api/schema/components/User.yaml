type: object
properties:
  id: 
    type: string
    format: uuid
    minLength: 36
    maxLength: 36
  email:
    type: string
    description: The email of the user
    format: email
    minLength: 6
    maxLength: 320
  avatar_id:
    type: string
    description: The Gravatar ID of the user
    minLength: 64
    maxLength: 64
    pattern: "^[a-f0-9]{64}$"
required: [id, email, avatar_id]